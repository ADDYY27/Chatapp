name: Chattr CD

on:
  workflow_run:
    workflows: ["Chattr CI"]
    types:
      - completed
jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main' }}
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull addyy27/chattr-backend:latest
            docker pull addyy27/chattr-frontend:latest

            docker stop chattr-backend || true
            docker rm chattr-backend || true

            docker stop chattr-frontend || true
            docker rm chattr-frontend || true

            docker run -d \
              --name chattr-backend \
              -p 3000:3000 \
              --env-file ~/chattr-backend.env \
              addyy27/chattr-backend:latest

            docker run -d \
              --name chattr-frontend \
              -p 80:80 \
              addyy27/chattr-frontend:latest