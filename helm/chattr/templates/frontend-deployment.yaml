apiVersion: apps/v1
kind: Deployment

metadata:
  name: chattr-frontend

spec:
  replicas: {{ .Values.frontend.replicaCount }}

  selector:
    matchLabels:
      app: chattr-frontend

  template:
    metadata:
      labels:
        app: chattr-frontend

    spec:
      containers:
        - name: chattr-frontend

          image: "{{ .Values.frontend.image.repository }}:{{ .Values.frontend.image.tag }}"
          imagePullPolicy: {{ .Values.frontend.image.pullPolicy }}

          ports:
            - containerPort: 80