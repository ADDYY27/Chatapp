{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress

metadata:
  name: chattr-ingress

spec:
  ingressClassName: {{ .Values.ingress.className }}

  rules:
    - host: chattr.local
      http:
        paths:

          - path: /api
            pathType: Prefix
            backend:
              service:
                name: chattr-backend-service
                port:
                  number: 3000

          - path: /socket.io
            pathType: Prefix
            backend:
              service:
                name: chattr-backend-service
                port:
                  number: 3000

          - path: /
            pathType: Prefix
            backend:
              service:
                name: chattr-frontend-service
                port:
                  number: 80
{{- end }}